<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#14213d"><title>Log in · Emboxa Web</title><link rel="icon" href="/static/icons/favicon-64.png" type="image/png"><link rel="stylesheet" href="/static/styles.css"></head><body class="auth-page"><main class="auth-card">
