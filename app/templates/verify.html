<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#14213d"><title>Verify email · Emboxa Web</title><link rel="icon" href="/static/icons/favicon-64.png" type="image/png"><link rel="stylesheet" href="/static/styles.css"></head><body class="auth-page"><main class="auth-card">
  <header class="auth-header"><a class="auth-brand" href="/it/"><img class="brand-mark logo-image" src="/static/icons/emboxa-192.png" alt="EMBOXA"><div><strong>EMBOXA</strong><small>WEB</small></div></a><select class="auth-locale" aria-label="Language"><option value="auto">Auto</option><option value="it">IT</option><option value="en">EN</option></select></header>
  <h1 data-i18n="verifyEmail">Verify your email</h1><p class="muted"><span data-i18n="verifyIntro">We sent a verification code to:</span><br><strong id="verify-destination"></strong></p>
  <form id="verify-form" novalidate><label><span data-i18n="email">Email</span><input name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" required><small class="field-error" data-error-for="email"></small></label><label><span data-i18n="verificationCode">Verification code</span><input class="otp-input" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" aria-label="Six-digit verification code" required><small class="field-error" data-error-for="code"></small></label><p class="form-error form-status" role="alert"></p><button class="primary wide" type="submit" data-i18n="verify">Verify</button></form>
  <button id="resend-code" class="auth-secondary-link text-button" type="button" data-i18n="resendCode">Resend code</button><p class="auth-links"><a href="/login" data-i18n="backToLogin">Back to login</a></p>
</main><script src="/static/i18n.js"></script><script src="/static/web-auth.js" defer></script></body></html>
