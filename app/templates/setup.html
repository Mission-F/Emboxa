<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#0B1F3A"><title>Configurazione · EMBOXA</title><link rel="icon" href="/static/icons/favicon-64.png" type="image/png"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/styles.css"></head>
<body class="auth-page"><main class="auth-card">
  <div class="auth-brand"><img class="brand-mark logo-image" src="/static/icons/emboxa-192.png" alt="EMBOXA"><div><strong>EMBOXA</strong><small>PRIVATE MAIL ARCHIVE</small></div></div>
  <p class="eyebrow">PRIMO AVVIO</p><h1>Configura Emboxa Web</h1><p class="muted">Crea il primo amministratore del servizio.</p>
  <form id="auth-form" data-mode="setup"><label>Nome utente<input name="username" minlength="3" maxlength="120" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" minlength="10" autocomplete="new-password" required><small>Almeno 10 caratteri</small></label><label>Conferma password<input name="confirm" type="password" minlength="10" autocomplete="new-password" required></label><p id="form-error" class="form-error" role="alert"></p><button class="primary wide" type="submit">Crea amministratore</button></form>
  <p class="local-assurance"><span></span>Area riservata agli amministratori</p>
</main><script src="/static/auth.js" defer></script></body>
</html>
