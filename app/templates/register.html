<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#14213d"><title>Create account · Emboxa Web</title><link rel="icon" href="/static/icons/favicon-64.png" type="image/png"><link rel="stylesheet" href="/static/styles.css"></head><body class="auth-page"><main class="auth-card">
  <header class="auth-header"><a class="auth-brand" href="/it/"><img class="brand-mark logo-image" src="/static/icons/emboxa-192.png" alt="EMBOXA"><div><strong>EMBOXA</strong><small>WEB</small></div></a><select class="auth-locale" aria-label="Language"><option value="auto">Auto</option><option value="it">IT</option><option value="en">EN</option></select></header>
  <h1 data-i18n="createAccount">Create account</h1><p class="muted" data-i18n="planBlurb">15 GB · 5 mailboxes · versioned email archives.</p>
  {% if registration_enabled %}<form id="register-form" novalidate><label><span data-i18n="email">Email</span><input name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" required><small class="field-error" data-error-for="email"></small></label><label><span data-i18n="password">Password</span><div class="password-control"><input name="password" type="password" minlength="10" autocomplete="new-password" required><button type="button" data-password-toggle aria-label="Show password" data-i18n="show">Show</button></div><small class="field-error" data-error-for="password"></small></label><label><span data-i18n="confirmPassword">Confirm password</span><div class="password-control"><input name="confirm_password" type="password" minlength="10" autocomplete="new-password" required><button type="button" data-password-toggle aria-label="Show password" data-i18n="show">Show</button></div><small class="field-error" data-error-for="confirm_password"></small></label><label class="legal-check"><input name="terms" type="checkbox" required><span><span data-i18n="termsConsent">I accept the Terms and acknowledge the Privacy Policy.</span> <a href="/en/terms">Terms</a> · <a href="/en/privacy">Privacy</a></span></label><p class="form-error form-status" role="alert"></p><button class="primary wide" type="submit" data-i18n="createAccount">Create account</button></form>{% else %}<p class="auth-notice" data-i18n="registrationDisabled">Registration is temporarily disabled. Contact support if you need access.</p>{% endif %}
  <p class="auth-links"><span data-i18n="alreadyRegistered">Already have an account?</span> <a href="/login" data-i18n="logIn">Log in</a></p>
</main><script src="/static/i18n.js"></script><script src="/static/web-auth.js" defer></script></body></html>
